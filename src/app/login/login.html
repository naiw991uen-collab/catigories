<div class="login-container">
  <form class="login-form" [formGroup]="loginForm" (ngSubmit)="SubmitData()">
    <h2 class="text-center mb-4">🐾 CatHub Login</h2>

    <label for="username">Username :</label>
    <input type="text" id="username" class="form-control" formControlName="username" placeholder="Enter username">

    <label for="password" class="mt-3">Password :</label>
    <input type="password" id="password" class="form-control" formControlName="password" placeholder="Enter password">

    <button type="submit" class="btn btn-login mt-4 w-100" [class.btn-pressed]="btnPressed">Login</button>
  </form>
</div>
