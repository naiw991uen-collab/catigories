@if (isLoading()) { 
  <p style="background-color: teal; color: white;">Is Loading </p> 
} @else if (error()) { 
  <p style="background-color: tan; color: white;">Error ya User</p>
} @else { 
  <div class="container">
    <div class="row">
      @for (category of categories(); track $index; let index = $index) { 
        <div class="col-lg-3 col-md-6 col-sm-12 p-5 text-center"> 
          <img [src]="images[index]" alt="" style="width: 300px; height: 300px; margin-left:-20px"> 
          <h2>{{ category }}</h2> 
          <!-- زر بنفس ستايل Navbar -->
          <button class="btn btn-cat mt-3" [routerLink]="['/products', category]">All Products</button> 
        </div> 
      } 
    </div> 
  </div> 
}
