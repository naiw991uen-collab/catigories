@if (isLoading()) {
<p style="background-color: teal; color: white;">Is Loading </p>
} @else if (error()){
    <p style="background-color: tan; color: white;">Error ya User</p>
} @else {

    <div class="container">
   <div class="row">
        @for (product of products(); track product) {
      <div  class="col-lg-3 col-md-6 col-sm-12 p-5 text-center">
   
          <img [src]="product.images[0]" alt="" width="100" [routerLink]="['/single',product.id]">
          <h2>{{product.title}}</h2>
          <h4>{{product.price}}</h4>
       </div>
    }
   </div>
</div>
   
}
